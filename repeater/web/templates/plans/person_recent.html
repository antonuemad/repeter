{% if recent_items %}<section class="person-recent"><div class="page-heading"><h2>{{ t('hub.recent') }}</h2><a href="/library?profile_id={{ person.id }}">{{ t('hub.all_content') }}</a></div><ul class="plain">{% for item in recent_items %}<li><a href="/library/{{ item.id }}" dir="auto">{{ m.video_title(item) }}</a><span>{{ m.badge('video_status', item.status) }} · {{ t('media.' ~ item.media_kind ~ '_' ~ item.content_format) }}</span></li>{% endfor %}</ul></section>{% endif %}
