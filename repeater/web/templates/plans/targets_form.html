<form method="post" action="/plans/{{ plan.id }}/targets" class="stack" data-plan-targets>{{ revision() }}
{% if accounts %}<label data-filter-control hidden>{{ t('plan.search') }}<input type="search" data-plan-filter autocomplete="off"></label>
<div class="plan-target-list">{% for a in accounts %}<label class="plan-target" data-plan-account><input type="checkbox" name="targets" value="{{ a.id }}"{% if (a.id|string in submitted.get('targets', [])) or ('targets' not in submitted and a.id in selected) %} checked{% endif %}{% if a.status != 'active' %} disabled{% endif %}><span><bdi>{{ a.display_name or a.external_id }}</bdi><span class="small muted">{{ platform_name(a.platform) }} · {{ t('account_status.' ~ a.status) }}</span></span></label>{% endfor %}</div><p data-plan-no-matches hidden class="muted" role="status">{{ t('plan.no_matches') }}</p>{% else %}<p class="muted">{{ t('plan.no_accounts') }}</p>{% endif %}
<button type="submit" class="button">{{ t('wizard.save_pages') if wizard_step is defined else t('plan.save_targets') }}</button></form>
