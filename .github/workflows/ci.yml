name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (empty = the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REPEATER_TEST_PG: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # rclone: the off-site backup rules in tests/test_deploy.py run against its local backend.
      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg rclone

      - name: Install Repeater with dev tools
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: python -m pytest -q

  docker:
    name: Docker image and deploy files
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The image's own ffmpeg (Debian's, newer than the runner's) runs the media tests below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          bash -n deploy/*.sh
          shellcheck -x deploy/*.sh

      - name: Validate docker-compose.yml with .env.example
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config --quiet

      - name: Validate Caddyfile
        run: |
          docker run --rm -e REPEATER_DOMAIN=rotator.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build the image
        run: |
          docker build --target app -t repeater:ci .
          # docker-compose.yml runs repeater-app:<tag>, never pulls it.
          docker tag repeater:ci repeater-app:latest

      - name: Media and import tests on the shipped image
        env:
          REPEATER_TEST_PG: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          docker build --target test -t repeater:ci-test .
          docker run --rm --network host -e REPEATER_TEST_PG -v "$PWD/tests:/app/tests:ro" repeater:ci-test

      - name: Smoke-test the image
        run: |
          docker run --rm repeater:ci sh -c '
            set -e
            test "$(id -u)" = 10001
            ffmpeg -version | head -n 1
            deno --version | head -n 1
            python -c "import repeater.cli, repeater.web.app, repeater.jobs.worker, yt_dlp_ejs"
            python -m repeater.cli --help > /dev/null
          '

      - name: Backup, restore and forwarded-header self-test (throwaway compose project)
        run: bash deploy/selftest.sh repeater-app:latest

