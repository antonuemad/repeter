name: External availability monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_notifications:
        description: Send labelled simulated failure/recovery emails, without stopping the site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repeater-external-monitor
  cancel-in-progress: false

jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPEATER_SMTP_HOST: ${{ secrets.REPEATER_SMTP_HOST }}
      REPEATER_SMTP_PORT: ${{ secrets.REPEATER_SMTP_PORT }}
      REPEATER_SMTP_USERNAME: ${{ secrets.REPEATER_SMTP_USERNAME }}
      REPEATER_SMTP_PASSWORD_B64: ${{ secrets.REPEATER_SMTP_PASSWORD_B64 }}
      REPEATER_SMTP_FROM: info@magic-lap.com
      REPEATER_SMTP_SSL: 'true'
      REPEATER_OPERATOR_EMAIL: info@magic-lap.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore notification state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: external-monitor-state
          key: external-monitor-${{ github.run_id }}
          restore-keys: external-monitor-
      - name: Check HTTPS from outside the server
        run: python3 deploy/external_monitor.py
      - name: Simulate failure and recovery notifications
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notifications }}
        env:
          DRILL_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 deploy/notification_drill.py --id "$DRILL_ID"
      - name: Save notification state
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: external-monitor-state
          key: external-monitor-${{ github.run_id }}
