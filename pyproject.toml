[project]
name = "repeater"
version = "0.1.0"
description = "Repeater: watch a creator's source platform and re-publish short videos to TikTok, YouTube Shorts, Instagram Reels and Facebook Reels on a rotation schedule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=42",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "yt-dlp[default]>=2026.8.19",
  "pillow>=10.4",
  "imagehash>=4.3",
  "numpy>=1.26",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "ruff>=0.5",
  "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repeater*"]

[tool.setuptools.package-data]
repeater = ["web/templates/**/*", "web/static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S603", "S607", "E501"]

[tool.ruff.format]
# Alembic writes revision files in its own style; they are generated, not hand-formatted.
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
"migrations/**" = ["E", "W", "I", "UP"]
